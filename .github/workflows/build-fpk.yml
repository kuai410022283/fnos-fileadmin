name: Build fnOS FPK

on:
  workflow_dispatch:
    inputs:
      fileadmin_version:
        description: "FileAdmin version, three segments (for example 1.0.2)"
        required: true
        default: "1.0.16"
        type: string
      fileadmin_ref:
        description: "FileAdmin git ref to build (tag, branch or commit)"
        required: true
        default: "main"
        type: string
  push:
    tags:
      - "v*"

env:
  FILEADMIN_REPO: kuai410022283/fileadmin
  PACKAGE_NAME: fileadmin
  FNPACK_VERSION: 1.2.3

permissions:
  contents: write

concurrency:
  group: fnos-fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.fileadmin_version }}
          SOURCE_INPUT: ${{ inputs.fileadmin_ref }}
        run: |
          set -euo pipefail
          RAW="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          RAW="${RAW#v}"
          if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Version must be three numeric segments, optionally with a numeric suffix: x.y.z or x.y.z-m"
            exit 1
          fi
          SOURCE_REF="${SOURCE_INPUT:-main}"
          echo "raw=${RAW}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${RAW}" >>"${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >>"${GITHUB_OUTPUT}"
          echo "Building FileAdmin ${RAW} from ${FILEADMIN_REPO}@${SOURCE_REF}"

      - name: Checkout FileAdmin source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FILEADMIN_REPO }}
          ref: ${{ steps.version.outputs.source_ref }}
          path: source

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Build Linux binaries
        shell: bash
        env:
          RAW: ${{ steps.version.outputs.raw }}
        run: |
          set -euo pipefail
          mkdir -p package/app/server
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            suffix="${pair##*:}"
            echo "Building linux/${arch} -> ${suffix}"
            (
              cd source
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
                go build -trimpath \
                -ldflags "-s -w -X main.version=v${RAW}" \
                -o "../package/app/server/fileadmin_${suffix}" \
                ./cmd/fileadmin
            )
          done
          chmod +x package/app/server/fileadmin_*
          cp source/LICENSE source/NOTICE package/
          chmod +x package/cmd/* package/app/ui/*.cgi 2>/dev/null || true

      - name: Update manifest
        shell: bash
        env:
          RAW: ${{ steps.version.outputs.raw }}
        run: |
          set -euo pipefail
          sed -i "s/^version[[:space:]]*=.*/version               = ${RAW}/" package/manifest
          # Shell scripts and manifests must keep LF when packaged on Linux.
          find package/cmd package/wizard package/i18n -type f -exec sed -i 's/\r$//' {} +
          sed -i 's/\r$//' package/manifest
          sed -i 's/\r$//' package/app/ui/config package/app/server/config.yaml.template package/config/* 2>/dev/null || true
          echo "--- manifest ---"
          cat package/manifest
          echo "--- package tree ---"
          find package -maxdepth 3 -type f | sort

      - name: Download fnpack
        shell: bash
        run: |
          set -euo pipefail
          URL="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "Downloading ${URL}"
          curl -fSL --retry 3 -o fnpack "${URL}"
          chmod +x fnpack
          ./fnpack --help || true

      - name: Build FPK
        id: fpk
        shell: bash
        env:
          RAW: ${{ steps.version.outputs.raw }}
        run: |
          set -euo pipefail
          ./fnpack build --directory package
          BUILT="$(find . -maxdepth 2 -name '*.fpk' -type f | head -n 1)"
          if [ -z "${BUILT}" ]; then
            echo "::error::fnpack did not produce a .fpk file"
            exit 1
          fi
          NAME="${PACKAGE_NAME}_all_v${RAW}.fpk"
          mv "${BUILT}" "${NAME}"
          sha256sum "${NAME}" >"${NAME}.sha256"
          echo "name=${NAME}" >>"${GITHUB_OUTPUT}"
          ls -lh "${NAME}" "${NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-fileadmin-fpk
          path: |
            ${{ steps.fpk.outputs.name }}
            ${{ steps.fpk.outputs.name }}.sha256
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FPK: ${{ steps.fpk.outputs.name }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          cat >"${NOTES}" <<EOF
          FileAdmin fnOS application package.

          - Version: ${TAG}
          - Platform: x86_64 + aarch64 (platform=all)
          - App entry: http://NAS-IP:18080/login
          - Data: /var/apps/fileadmin/var

          Install from fnOS App Center -> Manual install, then open FileAdmin
          and add storage roots. The app uses FileAdmin's own authentication.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FPK}" "${FPK}.sha256" --clobber
          else
            gh release create "${TAG}" "${FPK}" "${FPK}.sha256" \
              --title "FileAdmin fnOS ${TAG}" \
              --notes-file "${NOTES}"
          fi
          rm -f "${NOTES}"
